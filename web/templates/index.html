<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AutoMarket - Explora nuestro inventario de vehículos de alta gama.">
    <title>AutoMarket - Catálogo de Vehículos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body class="marketplace-body">
    <header class="navbar glass-header">
        <div class="logo">AutoMarket</div>
        <nav>
            <ul>
                <li><a href="/">Inicio</a></li>
                <li><a href="/login" class="btn-secondary">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </header>
    <main class="marketplace-container">
        <h1 class="page-title">Explora Nuestros Vehículos</h1>
        <div class="vehicle-grid">
            <!-- Vehículo 1 -->
            <div class="vehicle-card glass-card">
                <div class="vehicle-img placeholder-img">Ferrari F8 Tributo</div>
                <div class="vehicle-info">
                    <h2>Ferrari F8 Tributo</h2>
                    <p class="price">$350,000</p>
                    <p class="specs">2023 | 0 km | Automático</p>
                    <button class="btn-primary">Comprar Ahora</button>
                </div>
            </div>
            <!-- Vehículo 2 -->
            <div class="vehicle-card glass-card">
                <div class="vehicle-img placeholder-img">Porsche 911 GT3</div>
                <div class="vehicle-info">
                    <h2>Porsche 911 GT3</h2>
                    <p class="price">$220,000</p>
                    <p class="specs">2022 | 5,000 km | Manual</p>
                    <button class="btn-primary">Comprar Ahora</button>
                </div>
            </div>
            <!-- Vehículo 3 -->
            <div class="vehicle-card glass-card">
                <div class="vehicle-img placeholder-img">Tesla Model S Plaid</div>
                <div class="vehicle-info">
                    <h2>Tesla Model S Plaid</h2>
                    <p class="price">$140,000</p>
                    <p class="specs">2024 | 0 km | Eléctrico</p>
                    <button class="btn-primary">Comprar Ahora</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
