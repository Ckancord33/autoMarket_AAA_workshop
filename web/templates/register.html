<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoMarket - Registro de Vendedor</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header class="navbar">
        <a href="/" class="nav-brand">
            Auto<span>Market</span>
        </a>
        <nav>
            <ul class="nav-menu">
                <li><a href="/" class="nav-link">Catálogo Público</a></li>
                <li><a href="/login" class="nav-link">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-container">
        {{if .Error}}
            <div class="alert alert-error">
                {{.Error}}
            </div>
        {{end}}

        <section class="auth-box auth-box-single">
            <h2>Crear Cuenta de Vendedor</h2>
            <p>Regístrate de forma autónoma para publicar y gestionar vehículos (HU-VEN-01).</p>

            <form action="/register" method="POST">
                <div class="form-group" style="margin-bottom: 0.85rem;">
                    <label for="name">Nombre Completo</label>
                    <input type="text" id="name" name="name" placeholder="Ej. Carlos Vendedor" required>
                </div>

                <div class="form-group" style="margin-bottom: 0.85rem;">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="carlos@correo.com" required>
                </div>

                <div class="form-group" style="margin-bottom: 0.85rem;">
                    <label for="phone">Teléfono de Contacto</label>
                    <input type="tel" id="phone" name="phone" placeholder="+57 300 123 4567" required>
                </div>

                <div class="form-group" style="margin-bottom: 0.85rem;">
                    <label for="city">Ciudad</label>
                    <input type="text" id="city" name="city" placeholder="Bogotá, Medellín..." required>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="password">Contraseña (Mínimo 6 caracteres)</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" minlength="6" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Registrarme como Vendedor</button>
            </form>

            <div class="auth-switch">
                <span>¿Ya tienes una cuenta registrada?</span>
                <a href="/login" class="auth-link">Inicia sesión</a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>AutoMarket &bull; Sistema de Gestión y Catálogo de Vehículos.</p>
    </footer>

</body>
</html>
